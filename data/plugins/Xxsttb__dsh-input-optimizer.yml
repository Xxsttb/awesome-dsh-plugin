url: https://github.com/Xxsttb/dsh-input-optimizer
name: Xxsttb/dsh-input-optimizer
category: ui
description:
  en: 'Adds a four-pointed-star button left of the composer''s model selector that rewrites the unsent draft in place before it goes out: grammar, wording and punctuation fixed, and execution order corrected — prerequisites moved ahead of the steps that need them, a buried goal surfaced, asks tangled in one sentence separated. Code, commands, file paths, identifiers, numbers, units and URLs are preserved byte-for-byte and the original language is kept. It never answers the request and never adds facts, and text typed while a rewrite is in flight is not overwritten. Its own settings page holds the rewrite instruction, whether to follow the conversation''s model or pin another provider and model, and the reasoning effort; the model and effort options come from the dropdown of what this profile can route.'
  zh: '在输入框模型选择器左侧加一个四角星按钮，发送前就地改写尚未发出的草稿：修正语法、用词与标点，并纠正制作顺序——把前置条件移到需要它的步骤之前、把被埋没的目标提上来、把缠在一句里的多个要求拆开。代码、命令、文件路径、标识符、数字、单位与 URL 逐字节保留，原语言不变。它不回答请求、不添加事实，也不会覆盖改写期间新输入的文本。插件自带设置页，可配置改写指令、跟随当前对话模型还是固定其他提供方与模型、以及推理强度；模型与强度选项取自本 profile 实际可路由的模型下拉框。'
